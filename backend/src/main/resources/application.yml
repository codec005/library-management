spring:
  application:
    name: library-management
  datasource:
    url: jdbc:h2:mem:library_management;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  profiles:
    default: local

server:
  port: 8080
  tomcat:
    max-http-form-post-size: 10MB
    max-swallow-size: 10MB

app:
  branding:
    storage-dir: ${BRANDING_STORAGE_DIR:./data/branding}
  settings:
    storage-dir: ${SETTINGS_STORAGE_DIR:./data/settings}
  security:
    allowed-origins: "*"
    jwt-secret: ${JWT_SECRET:library-dev-jwt-secret-change-me-32chars-min}
    jwt-expiration-minutes: ${JWT_EXPIRATION_MINUTES:720}
