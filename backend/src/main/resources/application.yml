spring:
  application:
    name: library-management
  datasource:
    url: jdbc:h2:mem:library_management;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  profiles:
    default: local

server:
  port: 8080

app:
  security:
    allowed-origins: "http://localhost:5173,http://127.0.0.1:5173,http://192.168.*.*:5173,http://10.*.*.*:5173,http://172.*.*.*:5173,https://localhost:5173,https://127.0.0.1:5173,https://192.168.*.*:5173,https://10.*.*.*:5173,https://172.*.*.*:5173,http://localhost:5174,http://127.0.0.1:5174,http://192.168.*.*:5174,http://10.*.*.*:5174,http://172.*.*.*:5174,https://localhost:5174,https://127.0.0.1:5174,https://192.168.*.*:5174,https://10.*.*.*:5174,https://172.*.*.*:5174"
