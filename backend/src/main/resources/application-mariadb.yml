spring:
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/library_management}
    username: ${DB_USERNAME:library_user}
    password: ${DB_PASSWORD:library_password}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect

app:
  security:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}
